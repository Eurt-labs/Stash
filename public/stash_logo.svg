<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#0c0e14"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2.5"/>

  <!-- Minimalist Continuous Music Note into Download Arrow Glyph -->
  <!-- Note Head Loop -->
  <circle
    cx="36"
    cy="62"
    r="14"
    stroke="#ffffff"
    stroke-width="5.5"
  />

  <!-- Stem rising from note tangent, arching over, and dropping down as arrow shaft -->
  <path
    d="M50 62 V28 C50 15 70 15 70 28 V56"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Download Arrowhead -->
  <path
    d="M59 46 L70 56 L81 46"
    stroke="#ffffff"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
