<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Seamless Dark Emerald Desert Radial Gradient -->
    <radialGradient id="trAura" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#064e3b" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#010804" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="trSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010904" />
      <stop offset="40%" stop-color="#031a0e" />
      <stop offset="75%" stop-color="#062b18" />
      <stop offset="100%" stop-color="#010703" />
    </linearGradient>

    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#062e1a" />
      <stop offset="100%" stop-color="#010d06" />
    </linearGradient>

    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes slowEmeraldBreathe {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.07); opacity: 0.95; }
      }
      @keyframes slowMonolithGlow {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 55px rgba(52, 211, 153, 0.75)); }
      }
      @keyframes slowEmberFloat {
        0%, 100% { transform: translateY(0px); opacity: 0.35; }
        50% { transform: translateY(-35px); opacity: 0.85; }
      }
      .anim-emerald-aura { animation: slowEmeraldBreathe 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50% 45%; }
      .anim-monolith { animation: slowMonolithGlow 12s ease-in-out infinite; }
      .anim-embers { animation: slowEmberFloat 9s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Desert Night Base -->
  <rect width="1920" height="1080" fill="url(#trSky)" />

  <!-- Smooth Breathing Emerald Desert Aura -->
  <rect width="1920" height="1080" fill="url(#trAura)" class="anim-emerald-aura" />

  <!-- Minimalist Celestial Monolith Sun on Horizon -->
  <g class="anim-monolith">
    <circle cx="960" cy="520" r="180" fill="#059669" filter="url(#emeraldGlow)" />
    <circle cx="960" cy="520" r="140" fill="#10b981" opacity="0.6" />
  </g>

  <!-- Sweeping Desert Sand Dune Silhouettes -->
  <path d="M-50,620 Q480,500 1020,580 T2020,540 L2020,1080 L-50,1080 Z" fill="url(#duneGrad)" />
  <path d="M-50,620 Q480,500 1020,580 T2020,540" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.6" />

  <path d="M-50,740 Q620,600 1240,710 T2020,660 L2020,1080 L-50,1080 Z" fill="#021008" />
  <path d="M-50,740 Q620,600 1240,710 T2020,660" fill="none" stroke="#34d399" stroke-width="2" opacity="0.7" />

  <!-- Delicate Floating Green Cosmic Embers -->
  <g fill="#34d399" class="anim-embers">
    <circle cx="340" cy="440" r="2" />
    <circle cx="620" cy="360" r="2.8" opacity="0.9" />
    <circle cx="820" cy="480" r="1.8" />
    <circle cx="1140" cy="400" r="2.5" opacity="0.8" />
    <circle cx="1420" cy="340" r="2" />
    <circle cx="1680" cy="460" r="2.6" opacity="0.9" />
  </g>
</svg>
