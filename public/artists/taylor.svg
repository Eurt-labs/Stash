<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Twilight Nebula Gradient -->
    <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070312" />
      <stop offset="35%" stop-color="#140828" />
      <stop offset="70%" stop-color="#240c42" />
      <stop offset="100%" stop-color="#060210" />
    </linearGradient>

    <!-- Purple Nebula Glow -->
    <filter id="purpleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes twinkleFast {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes twinkleSlow {
        0%, 100% { opacity: 0.9; transform: scale(1.2); }
        50% { opacity: 0.25; transform: scale(0.7); }
      }
      @keyframes moonGlow {
        0%, 100% { filter: drop-shadow(0 0 25px #c084fc); }
        50% { filter: drop-shadow(0 0 55px #e9d5ff); }
      }
      @keyframes slowRotateClock {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes nebulaDrift {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.22; }
        50% { transform: translate(30px, -20px) scale(1.06); opacity: 0.34; }
      }
      .anim-twinkle-1 { animation: twinkleFast 2.5s ease-in-out infinite; }
      .anim-twinkle-2 { animation: twinkleSlow 4s ease-in-out infinite; }
      .anim-moon { animation: moonGlow 5s ease-in-out infinite; }
      .anim-clock-ring { animation: slowRotateClock 90s linear infinite; transform-origin: 1480px 240px; }
      .anim-nebula { animation: nebulaDrift 14s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1920" height="1080" fill="url(#tBg)" />

  <!-- Ethereal Animated Nebula Clouds -->
  <circle cx="1400" cy="400" r="500" fill="#9061f9" class="anim-nebula" filter="url(#purpleGlow)" />
  <circle cx="500" cy="650" r="450" fill="#38bdf8" opacity="0.18" filter="url(#purpleGlow)" />
  <circle cx="960" cy="300" r="400" fill="#a855f7" opacity="0.2" filter="url(#purpleGlow)" />

  <!-- Luminous Animated Crescent Moon (Midnights Motif) -->
  <g class="anim-moon" transform="translate(1480, 240)">
    <circle cx="0" cy="0" r="90" fill="#f5f3ff" filter="url(#starGlow)" opacity="0.9" />
    <!-- Cutout to make crescent -->
    <circle cx="-30" cy="-18" r="82" fill="#140828" />
  </g>

  <!-- Rotating Clock Ring & Roman Numerals (Midnights Motif) -->
  <g class="anim-clock-ring" opacity="0.35" stroke="#ac8af8" fill="none">
    <circle cx="1480" cy="240" r="140" stroke-width="1.5" stroke-dasharray="4,8" />
    <circle cx="1480" cy="240" r="170" stroke-width="1" />
  </g>
  <g transform="translate(1480, 240)">
    <!-- Fixed Clock Hands at Midnight (12:00) -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#f5f3ff" stroke-width="2.5" />
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#f5f3ff" stroke-width="3.5" />
  </g>

  <!-- Constellations & Twinkling Stars -->
  <g fill="#f5f3ff">
    <!-- Star cluster A -->
    <circle cx="240" cy="180" r="3.5" class="anim-twinkle-1" filter="url(#starGlow)" />
    <circle cx="340" cy="220" r="2.5" />
    <circle cx="420" cy="140" r="4" class="anim-twinkle-2" filter="url(#starGlow)" />
    <circle cx="510" cy="260" r="3" class="anim-twinkle-1" />
    <circle cx="380" cy="340" r="2.5" />

    <!-- Constellation Lines -->
    <line x1="240" y1="180" x2="340" y2="220" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />
    <line x1="340" y1="220" x2="420" y2="140" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />
    <line x1="340" y1="220" x2="380" y2="340" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />
    <line x1="420" y1="140" x2="510" y2="260" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />

    <!-- Star cluster B (Right / Center) -->
    <circle cx="820" cy="190" r="3" class="anim-twinkle-2" />
    <circle cx="950" cy="120" r="4" class="anim-twinkle-1" filter="url(#starGlow)" />
    <circle cx="1080" cy="220" r="3.5" class="anim-twinkle-2" />
    <circle cx="1190" cy="160" r="2.5" />

    <line x1="820" y1="190" x2="950" y2="120" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />
    <line x1="950" y1="120" x2="1080" y2="220" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />
    <line x1="1080" y1="220" x2="1190" y2="160" stroke="rgba(172, 138, 248, 0.4)" stroke-width="1" />

    <!-- Star Dust Field -->
    <circle cx="120" cy="450" r="2" class="anim-twinkle-1" />
    <circle cx="280" cy="520" r="2.5" class="anim-twinkle-2" />
    <circle cx="480" cy="480" r="1.8" class="anim-twinkle-1" />
    <circle cx="680" cy="380" r="2.2" class="anim-twinkle-2" />
    <circle cx="740" cy="560" r="2.5" class="anim-twinkle-1" />
    <circle cx="890" cy="420" r="2" class="anim-twinkle-2" />
    <circle cx="1050" cy="530" r="2.8" class="anim-twinkle-1" />
    <circle cx="1240" cy="460" r="1.8" class="anim-twinkle-2" />
    <circle cx="1380" cy="620" r="2.5" class="anim-twinkle-1" />
    <circle cx="1620" cy="480" r="2" class="anim-twinkle-2" />
    <circle cx="1780" cy="320" r="3" class="anim-twinkle-1" />
  </g>
</svg>
