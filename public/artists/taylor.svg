<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Seamless Twilight Nebula Gradient -->
    <radialGradient id="tAura" cx="75%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9061f9" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#7e3af2" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#3b0764" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070210" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060210" />
      <stop offset="40%" stop-color="#120626" />
      <stop offset="75%" stop-color="#1f0a3d" />
      <stop offset="100%" stop-color="#080214" />
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes slowNebulaBreathe {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.06); }
      }
      @keyframes slowMoonGlow {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 45px rgba(216, 180, 254, 0.8)); }
      }
      @keyframes starTwinkle1 {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.9; }
      }
      @keyframes starTwinkle2 {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.2; }
      }
      .anim-nebula { animation: slowNebulaBreathe 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 75% 30%; }
      .anim-moon { animation: slowMoonGlow 10s ease-in-out infinite; }
      .anim-star-1 { animation: starTwinkle1 6s ease-in-out infinite; }
      .anim-star-2 { animation: starTwinkle2 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#tSky)" />

  <!-- Smooth Breathing Lavender Nebula Aura -->
  <rect width="1920" height="1080" fill="url(#tAura)" class="anim-nebula" />

  <!-- Elegant Delicate Crescent Moon (Midnights Motif) in Top Right -->
  <g class="anim-moon" transform="translate(1500, 200)">
    <!-- Crescent Moon Path -->
    <path d="M0,0 C30,30 30,80 0,110 C45,95 65,55 50,15 C45,0 0,0 0,0 Z" fill="#f5f3ff" filter="url(#softGlow)" />
    <!-- Clock ring trace -->
    <circle cx="20" cy="55" r="95" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.2" stroke-dasharray="3,6" fill="none" />
  </g>

  <!-- Delicate Constellation Lines & Stars -->
  <g fill="#ffffff">
    <!-- Star Group 1 (Left Sky) -->
    <circle cx="280" cy="240" r="2" class="anim-star-1" />
    <circle cx="410" cy="190" r="2.8" class="anim-star-2" />
    <circle cx="520" cy="280" r="2" class="anim-star-1" />
    <circle cx="360" cy="350" r="1.8" class="anim-star-2" />

    <line x1="280" y1="240" x2="410" y2="190" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.9" />
    <line x1="410" y1="190" x2="520" y2="280" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.9" />
    <line x1="280" y1="240" x2="360" y2="350" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.9" />

    <!-- Star Group 2 (Center Sky) -->
    <circle cx="860" cy="210" r="2.2" class="anim-star-2" />
    <circle cx="980" cy="150" r="3" class="anim-star-1" />
    <circle cx="1120" cy="230" r="2" class="anim-star-2" />

    <line x1="860" y1="210" x2="980" y2="150" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.9" />
    <line x1="980" y1="150" x2="1120" y2="230" stroke="rgba(168, 85, 247, 0.3)" stroke-width="0.9" />

    <!-- Ambient Glistening Star Dust -->
    <circle cx="160" cy="480" r="1.2" class="anim-star-1" opacity="0.6" />
    <circle cx="340" cy="580" r="1.5" class="anim-star-2" opacity="0.7" />
    <circle cx="620" cy="460" r="1.4" class="anim-star-1" opacity="0.8" />
    <circle cx="780" cy="540" r="1.2" class="anim-star-2" opacity="0.6" />
    <circle cx="940" cy="440" r="1.8" class="anim-star-1" opacity="0.7" />
    <circle cx="1220" cy="520" r="1.5" class="anim-star-2" opacity="0.8" />
    <circle cx="1380" cy="400" r="1.2" class="anim-star-1" opacity="0.6" />
    <circle cx="1680" cy="560" r="1.6" class="anim-star-2" opacity="0.7" />
    <circle cx="1820" cy="380" r="1.4" class="anim-star-1" opacity="0.8" />
  </g>
</svg>
