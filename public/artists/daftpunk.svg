<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Seamless Golden Chrome & Obsidian Studio Radial Gradient -->
    <radialGradient id="dAura" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#451a03" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070501" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="dSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080601" />
      <stop offset="40%" stop-color="#181103" />
      <stop offset="75%" stop-color="#241704" />
      <stop offset="100%" stop-color="#060401" />
    </linearGradient>

    <linearGradient id="goldBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes slowGoldBreathe {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.06); opacity: 0.95; }
      }
      @keyframes slowLaserPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.8; }
      }
      @keyframes slowPyramidGlow {
        0%, 100% { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.3)); }
        50% { filter: drop-shadow(0 0 50px rgba(253, 224, 71, 0.65)); }
      }
      .anim-gold-aura { animation: slowGoldBreathe 13s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50% 45%; }
      .anim-lasers { animation: slowLaserPulse 9s ease-in-out infinite; }
      .anim-pyramid { animation: slowPyramidGlow 11s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Studio Base -->
  <rect width="1920" height="1080" fill="url(#dSky)" />

  <!-- Smooth Breathing Golden Amber Aura -->
  <rect width="1920" height="1080" fill="url(#dAura)" class="anim-gold-aura" />

  <!-- Minimalist Aesthetic Stage Laser Beams -->
  <g class="anim-lasers">
    <polygon points="960,780 180,0 260,0" fill="url(#goldBeam)" />
    <polygon points="960,780 580,0 660,0" fill="url(#goldBeam)" />
    <polygon points="960,780 920,0 1000,0" fill="url(#goldBeam)" />
    <polygon points="960,780 1260,0 1340,0" fill="url(#goldBeam)" />
    <polygon points="960,780 1660,0 1740,0" fill="url(#goldBeam)" />
  </g>

  <!-- Sleek Golden Chrome Pyramid Wireframe -->
  <g class="anim-pyramid">
    <polygon points="960,360 680,780 1240,780" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="2" />
    <line x1="960" y1="360" x2="960" y2="780" stroke="#fde047" stroke-width="1.5" />
    <line x1="820" y1="570" x2="1100" y2="570" stroke="#fbbf24" stroke-width="1.2" />
  </g>

  <!-- Minimal Gold Light Particles -->
  <g fill="#fbbf24" opacity="0.6">
    <circle cx="480" cy="420" r="1.8" />
    <circle cx="740" cy="340" r="2.2" />
    <circle cx="1180" cy="360" r="2" />
    <circle cx="1440" cy="440" r="1.8" />
  </g>
</svg>
