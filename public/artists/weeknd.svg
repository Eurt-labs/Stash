<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080103" />
      <stop offset="45%" stop-color="#1c0208" />
      <stop offset="70%" stop-color="#3b0510" />
      <stop offset="100%" stop-color="#0a0103" />
    </linearGradient>

    <!-- Glowing Synthwave Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Red Neon Glow -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="1920" height="1080" fill="url(#wBg)" />

  <!-- Ambient Red Fog -->
  <circle cx="960" cy="540" r="600" fill="#ff1e42" opacity="0.22" filter="url(#neonGlow)" />
  <circle cx="300" cy="400" r="400" fill="#e11d48" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="1620" cy="400" r="400" fill="#e11d48" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Massive Synthwave Sun (After Hours / Dawn FM Motif) -->
  <g transform="translate(960, 520)">
    <circle cx="0" cy="0" r="260" fill="url(#sunGrad)" filter="url(#neonGlow)" opacity="0.85" />
    <!-- Segment horizontal cuts -->
    <rect x="-300" y="20" width="600" height="12" fill="#1c0208" />
    <rect x="-300" y="55" width="600" height="16" fill="#1c0208" />
    <rect x="-300" y="95" width="600" height="22" fill="#1c0208" />
    <rect x="-300" y="145" width="600" height="30" fill="#1c0208" />
    <rect x="-300" y="205" width="600" height="40" fill="#1c0208" />
  </g>

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#090103" opacity="0.95">
    <rect x="0" y="480" width="80" height="140" />
    <rect x="70" y="440" width="60" height="180" />
    <rect x="120" y="460" width="90" height="160" />
    <rect x="200" y="420" width="70" height="200" />
    <rect x="260" y="490" width="80" height="130" />
    <rect x="330" y="450" width="110" height="170" />
    <rect x="430" y="410" width="60" height="210" />
    <rect x="480" y="470" width="100" height="150" />
    <rect x="570" y="430" width="80" height="190" />
    <rect x="640" y="460" width="90" height="160" />
    <rect x="720" y="400" width="70" height="220" />
    <polygon points="755,360 740,400 770,400" />

    <!-- Center Spire -->
    <rect x="780" y="440" width="120" height="180" />
    <rect x="890" y="420" width="80" height="200" />
    <rect x="960" y="450" width="100" height="170" />
    <rect x="1050" y="410" width="90" height="210" />
    <polygon points="1095,350 1080,410 1110,410" />
    <rect x="1130" y="470" width="70" height="150" />
    <rect x="1190" y="430" width="110" height="190" />
    <rect x="1290" y="460" width="80" height="160" />
    <rect x="1360" y="420" width="90" height="200" />
    <rect x="1440" y="450" width="120" height="170" />
    <rect x="1550" y="410" width="70" height="210" />
    <rect x="1610" y="470" width="90" height="150" />
    <rect x="1690" y="430" width="110" height="190" />
    <rect x="1790" y="450" width="130" height="170" />
  </g>

  <!-- Glowing Neon Windows in City -->
  <g fill="#ff1e42" opacity="0.6">
    <rect x="85" y="455" width="4" height="6" />
    <rect x="95" y="455" width="4" height="6" />
    <rect x="85" y="475" width="4" height="6" />
    <rect x="215" y="435" width="5" height="8" />
    <rect x="235" y="435" width="5" height="8" />
    <rect x="445" y="430" width="6" height="8" />
    <rect x="735" y="420" width="6" height="10" />
    <rect x="1065" y="430" width="6" height="10" />
    <rect x="1210" y="445" width="5" height="8" />
    <rect x="1375" y="435" width="6" height="8" />
    <rect x="1565" y="430" width="6" height="8" />
  </g>

  <!-- Retro Perspective Neon Grid Ground -->
  <g stroke="url(#laserGrad)" stroke-width="1.8" opacity="0.65">
    <!-- Horizon line -->
    <line x1="0" y1="580" x2="1920" y2="580" stroke="#ff1e42" stroke-width="2.5" />

    <!-- Latitudinal grid lines -->
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="630" x2="1920" y2="630" />
    <line x1="0" y1="675" x2="1920" y2="675" />
    <line x1="0" y1="735" x2="1920" y2="735" />
    <line x1="0" y1="815" x2="1920" y2="815" />
    <line x1="0" y1="920" x2="1920" y2="920" />
    <line x1="0" y1="1050" x2="1920" y2="1050" />

    <!-- Perspective Fan lines -->
    <line x1="960" y1="580" x2="-200" y2="1080" />
    <line x1="960" y1="580" x2="80" y2="1080" />
    <line x1="960" y1="580" x2="360" y2="1080" />
    <line x1="960" y1="580" x2="640" y2="1080" />
    <line x1="960" y1="580" x2="840" y2="1080" />
    <line x1="960" y1="580" x2="960" y2="1080" />
    <line x1="960" y1="580" x2="1080" y2="1080" />
    <line x1="960" y1="580" x2="1280" y2="1080" />
    <line x1="960" y1="580" x2="1560" y2="1080" />
    <line x1="960" y1="580" x2="1840" y2="1080" />
    <line x1="960" y1="580" x2="2120" y2="1080" />
  </g>
</svg>
