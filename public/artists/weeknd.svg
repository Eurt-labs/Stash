<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Seamless Cinematic Deep Noir & Crimson Gradient -->
    <radialGradient id="wAura" cx="50%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#be123c" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#4c0519" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070103" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090204" />
      <stop offset="50%" stop-color="#18040a" />
      <stop offset="75%" stop-color="#2a0510" />
      <stop offset="100%" stop-color="#080103" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#ff1e42" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff1e42" stop-opacity="0.02" />
    </linearGradient>

    <style>
      @keyframes slowAuraBreathe {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes slowSunGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 30px rgba(255, 30, 66, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 70px rgba(255, 30, 66, 0.75)); }
      }
      @keyframes slowMistDrift {
        0%, 100% { transform: translateX(-20px); opacity: 0.15; }
        50% { transform: translateX(20px); opacity: 0.3; }
      }
      .anim-aura { animation: slowAuraBreathe 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50% 58%; }
      .anim-sun { animation: slowSunGlow 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-mist { animation: slowMistDrift 16s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#wSky)" />

  <!-- Smooth Breathing Ambient Red Aura -->
  <rect width="1920" height="1080" fill="url(#wAura)" class="anim-aura" />

  <!-- Minimalist Aesthetic Sun on Horizon -->
  <g class="anim-sun">
    <circle cx="960" cy="560" r="220" fill="url(#sunGrad)" />
    <!-- Horizontal Slits -->
    <line x1="740" y1="460" x2="1180" y2="460" stroke="#18040a" stroke-width="6" />
    <line x1="740" y1="490" x2="1180" y2="490" stroke="#18040a" stroke-width="10" />
    <line x1="740" y1="525" x2="1180" y2="525" stroke="#18040a" stroke-width="14" />
    <line x1="740" y1="565" x2="1180" y2="565" stroke="#18040a" stroke-width="18" />
  </g>

  <!-- Soft Horizon Mist -->
  <ellipse cx="960" cy="580" rx="900" ry="160" fill="#ff1e42" class="anim-mist" />

  <!-- Sleek City Skyline Silhouette -->
  <path d="M0,580 L0,560 L60,560 L60,530 L110,530 L110,560 L180,560 L180,510 L220,510 L220,560 L290,560 L290,540 L350,540 L350,560 L430,560 L430,490 L480,490 L480,560 L560,560 L560,520 L620,520 L620,560 L710,560 L710,470 L760,470 L760,560 L850,560 L850,500 L900,500 L900,560 L980,560 L980,460 L1020,460 L1020,560 L1110,560 L1110,490 L1160,490 L1160,560 L1250,560 L1250,520 L1300,520 L1300,560 L1390,560 L1390,480 L1440,480 L1440,560 L1520,560 L1520,530 L1580,530 L1580,560 L1670,560 L1670,510 L1720,510 L1720,560 L1800,560 L1800,540 L1860,540 L1860,560 L1920,560 L1920,1080 L0,1080 Z" fill="#080103" />

  <!-- Subtle Perspective Grid Ground -->
  <g stroke="url(#gridGrad)" stroke-width="1.2" opacity="0.5">
    <line x1="0" y1="580" x2="1920" y2="580" stroke="#ff1e42" stroke-width="2" />
    <line x1="0" y1="610" x2="1920" y2="610" />
    <line x1="0" y1="655" x2="1920" y2="655" />
    <line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="0" y1="930" x2="1920" y2="930" />

    <line x1="960" y1="580" x2="0" y2="1080" />
    <line x1="960" y1="580" x2="384" y2="1080" />
    <line x1="960" y1="580" x2="768" y2="1080" />
    <line x1="960" y1="580" x2="960" y2="1080" />
    <line x1="960" y1="580" x2="1152" y2="1080" />
    <line x1="960" y1="580" x2="1536" y2="1080" />
    <line x1="960" y1="580" x2="1920" y2="1080" />
  </g>
</svg>
