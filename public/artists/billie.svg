<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Underwater Cobalt & Teal Radial Aura -->
    <radialGradient id="bAura" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#0c4a6e" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020814" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020814" />
      <stop offset="40%" stop-color="#041528" />
      <stop offset="75%" stop-color="#082542" />
      <stop offset="100%" stop-color="#020710" />
    </linearGradient>

    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes slowOceanBreathe {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.06); opacity: 0.95; }
      }
      @keyframes slowRaySway {
        0%, 100% { transform: skewX(0deg); opacity: 0.7; }
        50% { transform: skewX(3.5deg); opacity: 0.95; }
      }
      @keyframes slowBubbleDrift {
        0%, 100% { transform: translateY(0px); opacity: 0.35; }
        50% { transform: translateY(-40px); opacity: 0.8; }
      }
      .anim-ocean-aura { animation: slowOceanBreathe 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 50% 35%; }
      .anim-rays { animation: slowRaySway 12s ease-in-out infinite; transform-origin: top center; }
      .anim-bubbles { animation: slowBubbleDrift 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="1920" height="1080" fill="url(#bSky)" />

  <!-- Smooth Breathing Ocean Aura -->
  <rect width="1920" height="1080" fill="url(#bAura)" class="anim-ocean-aura" />

  <!-- Soft Sunlight Caustic Beams Sinking Through Water -->
  <g class="anim-rays">
    <polygon points="350,0 480,0 720,1080 420,1080" fill="url(#rayGrad)" />
    <polygon points="820,0 960,0 1280,1080 1020,1080" fill="url(#rayGrad)" />
    <polygon points="1320,0 1440,0 1780,1080 1520,1080" fill="url(#rayGrad)" />
  </g>

  <!-- Subtle Deep Ocean Water Caustic Curves -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.2">
    <path d="M-50,340 Q480,240 1020,320 T2020,280" />
    <path d="M-50,520 Q540,420 1140,500 T2020,460" />
    <path d="M-50,720 Q440,620 1060,700 T2020,660" />
  </g>

  <!-- Delicate Floating Bioluminescent Cyan Particles -->
  <g fill="#22d3ee" class="anim-bubbles">
    <circle cx="380" cy="520" r="2.5" />
    <circle cx="560" cy="420" r="3.2" opacity="0.9" />
    <circle cx="780" cy="620" r="2.2" />
    <circle cx="940" cy="480" r="3" opacity="0.8" />
    <circle cx="1180" cy="580" r="2" />
    <circle cx="1380" cy="440" r="3.5" opacity="0.9" />
    <circle cx="1620" cy="540" r="2.4" />
  </g>
</svg>
