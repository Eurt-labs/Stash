<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Seamless Sunset Rose Quartz Radial Gradient -->
    <radialGradient id="lAura" cx="72%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#e11d48" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#4c0519" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090204" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0205" />
      <stop offset="40%" stop-color="#1f0612" />
      <stop offset="75%" stop-color="#350a1e" />
      <stop offset="100%" stop-color="#080104" />
    </linearGradient>

    <filter id="roseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes slowRoseBreathe {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.06); opacity: 0.95; }
      }
      @keyframes slowVinylSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes slowSunsetGlow {
        0%, 100% { opacity: 0.65; filter: drop-shadow(0 0 25px rgba(244, 114, 182, 0.4)); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 55px rgba(251, 113, 133, 0.75)); }
      }
      .anim-rose-aura { animation: slowRoseBreathe 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 72% 45%; }
      .anim-vinyl-disc { animation: slowVinylSpin 30s linear infinite; transform-origin: 1460px 520px; }
      .anim-sunset-sun { animation: slowSunsetGlow 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#lSky)" />

  <!-- Smooth Breathing Sunset Rose Aura -->
  <rect width="1920" height="1080" fill="url(#lAura)" class="anim-rose-aura" />

  <!-- Sinking Golden Rose Sunset Sun -->
  <circle cx="1460" cy="460" r="190" fill="#f472b6" class="anim-sunset-sun" filter="url(#roseGlow)" />

  <!-- Large Minimalist Vinyl Record LP (Born to Die Motif) -->
  <g class="anim-vinyl-disc">
    <circle cx="1460" cy="520" r="240" fill="#0c0206" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.8" />
    <circle cx="1460" cy="520" r="215" fill="none" stroke="rgba(244, 114, 182, 0.18)" stroke-width="1" />
    <circle cx="1460" cy="520" r="190" fill="none" stroke="rgba(244, 114, 182, 0.12)" stroke-width="1" />
    <circle cx="1460" cy="520" r="165" fill="none" stroke="rgba(244, 114, 182, 0.18)" stroke-width="1" />
    <circle cx="1460" cy="520" r="140" fill="none" stroke="rgba(244, 114, 182, 0.12)" stroke-width="1" />
    <!-- Center Label -->
    <circle cx="1460" cy="520" r="80" fill="#e11d48" opacity="0.85" />
    <circle cx="1460" cy="520" r="10" fill="#ffffff" />
  </g>

  <!-- Hollywood Hills & Elegant California Palm Silhouettes -->
  <g fill="#070104">
    <path d="M-50,720 Q420,620 980,700 T2020,650 L2020,1080 L-50,1080 Z" />

    <!-- Palm Tree Silhouette (Left) -->
    <path d="M220,740 Q215,540 205,400 L212,400 Q225,540 228,740 Z" />
    <path d="M208,400 Q140,350 85,380 Q130,420 208,410" />
    <path d="M208,400 Q155,290 105,310 Q160,350 208,405" />
    <path d="M208,400 Q205,250 220,270 Q212,340 208,400" />
    <path d="M208,400 Q260,280 305,300 Q250,350 208,405" />
    <path d="M208,400 Q275,340 320,370 Q255,410 208,410" />
  </g>
</svg>
