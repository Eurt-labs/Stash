<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Monochromatic Subtle Background Gradient -->
    <linearGradient id="monoPipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="whiteLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <filter id="packetGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes travelWhitePacket {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(680px); opacity: 0; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -24; }
      }
      .anim-packet { animation: travelWhitePacket 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-dash { stroke-dasharray: 4,6; animation: dashAnim 1.2s linear infinite; }
      .sans-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
      .sans-norm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
      .mono-node { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-weight: 700; }
    </style>
  </defs>

  <!-- Clean Minimal Base (Zero Boxy Containers) -->
  <rect width="900" height="180" rx="12" fill="url(#monoPipeBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Section Title Header -->
  <text x="36" y="32" class="mono-node" font-size="11.5" fill="#a1a1aa" letter-spacing="0.08em">
    SEQUENTIAL 5-PHASE PROCESSING PIPELINE
  </text>
  <text x="36" y="48" class="sans-norm" font-size="11.5" fill="#71717a">
    Deterministic single-task queue guarantees zero thread starvation and 100% stable transcoding
  </text>

  <!-- Horizontal Monochromatic Stepper Line -->
  <g transform="translate(70, 96)">
    <!-- Rail Base -->
    <line x1="0" y1="0" x2="680" y2="0" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
    <line x1="0" y1="0" x2="680" y2="0" stroke="url(#whiteLineGrad)" stroke-width="2" class="anim-dash" />

    <!-- Animated Data Packet Pulse -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" filter="url(#packetGlow)" class="anim-packet" />
  </g>

  <!-- 5 Sleek Monochromatic Pipeline Nodes (Zero Boxy Cards) -->

  <!-- Node 01: Input -->
  <g transform="translate(70, 96)">
    <circle cx="0" cy="0" r="16" fill="#18181b" stroke="#ffffff" stroke-width="1.8" />
    <text x="0" y="4" class="mono-node" font-size="10.5" fill="#ffffff" text-anchor="middle">01</text>
    <text x="0" y="34" class="sans-bold" font-size="12" fill="#ffffff" text-anchor="middle">Input Link</text>
    <text x="0" y="48" class="sans-norm" font-size="10" fill="#a1a1aa" text-anchor="middle">YouTube / Music</text>
  </g>

  <!-- Node 02: Fetch -->
  <g transform="translate(240, 96)">
    <circle cx="0" cy="0" r="16" fill="#18181b" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <text x="0" y="4" class="mono-node" font-size="10.5" fill="#e4e4e7" text-anchor="middle">02</text>
    <text x="0" y="34" class="sans-bold" font-size="12" fill="#ffffff" text-anchor="middle">Fetch Info</text>
    <text x="0" y="48" class="sans-norm" font-size="10" fill="#a1a1aa" text-anchor="middle">yt-dlp JSON Dump</text>
  </g>

  <!-- Node 03: Download -->
  <g transform="translate(410, 96)">
    <circle cx="0" cy="0" r="16" fill="#18181b" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <text x="0" y="4" class="mono-node" font-size="10.5" fill="#e4e4e7" text-anchor="middle">03</text>
    <text x="0" y="34" class="sans-bold" font-size="12" fill="#ffffff" text-anchor="middle">Download</text>
    <text x="0" y="48" class="sans-norm" font-size="10" fill="#a1a1aa" text-anchor="middle">Live Stream Cache</text>
  </g>

  <!-- Node 04: Transcode -->
  <g transform="translate(580, 96)">
    <circle cx="0" cy="0" r="16" fill="#18181b" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    <text x="0" y="4" class="mono-node" font-size="10.5" fill="#e4e4e7" text-anchor="middle">04</text>
    <text x="0" y="34" class="sans-bold" font-size="12" fill="#ffffff" text-anchor="middle">Transcode</text>
    <text x="0" y="48" class="sans-norm" font-size="10" fill="#a1a1aa" text-anchor="middle">FFmpeg 320k Preset</text>
  </g>

  <!-- Node 05: Tag & Move -->
  <g transform="translate(750, 96)">
    <circle cx="0" cy="0" r="16" fill="#18181b" stroke="#ffffff" stroke-width="1.8" />
    <text x="0" y="4" class="mono-node" font-size="10.5" fill="#ffffff" text-anchor="middle">05</text>
    <text x="0" y="34" class="sans-bold" font-size="12" fill="#ffffff" text-anchor="middle">Tag &amp; Save</text>
    <text x="0" y="48" class="sans-norm" font-size="10" fill="#a1a1aa" text-anchor="middle">ID3v2.4 Cover Embed</text>
  </g>
</svg>
